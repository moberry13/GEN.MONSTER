<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — gen.monster</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/script.js" defer></script>
    <script src="js/filter.js" defer></script>
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <a href="index.html" class="logo">GEN.MONSTER</a>
         <button class="burger" id="burger" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
         </button>
        <nav class="nav" id="nav" >
            <ul>
                <li><a href="about.html">О компании</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="price.html">Прайс-лист</a></li>
            </ul>
</nav>
    </header>

    <!-- ЭКРАН 1: ЗАГОЛОВОК -->
    <section class="screen screen-page-head">
        <div class="screen-content">
            <p class="label">Collection 2026</p>
            <h1>Каталог</h1>
            <p class="page-desc">
                Солнцезащитные очки и оптические оправы.
                Каждая модель — это эксперимент формы и материала.
            </p>
        </div>
    </section>

          <!-- ЭКРАН 2: ФИЛЬТР И СЕТКА ТОВАРОВ -->
    <section class="catalog">
            <div class="catalog-layout">            
            <aside class="filters" id="filters">
                <!-- Сюда JS вставит чекбоксы -->
            </aside>

            <!-- ВАЖНО: мы поменяли id="elements" на id="catalog", чтобы совпадало с filter.js -->
            <div class="catalog-grid" id="catalog">
                <!-- Сюда JS вставит карточки товаров -->
            </div>

        </div>
    </section>

    <!-- ЭКРАН 3: ФИНАЛ + ПОДВАЛ -->
    <section class="screen screen-final">
        <div class="screen-content centered">
            <h2>
                Не нашли<br>
                свою модель?
            </h2>
            <a href="price.html" class="link-arrow">Смотреть прайс-лист →</a>
        </div>
        <footer class="footer">
            <div class="footer-brand">Gen.monster</div>
            <nav class="footer-nav">
                 <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="about.html">О компании</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="price.html">Прайс-лист</a></li>
                </ul>
            </nav>
            <div class="footer-copy">
                <button class="print-toggle" id="print-toggle" aria-label="Версия для печати">
                    🖨
                </button>
                <span>© 2026</span>
            </div>
        </footer>
    </section>

</body>
</html>
